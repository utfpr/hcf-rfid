name: beontag_utfpr_agro_mobile
description: "Android Flutter app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Regenerar com: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/hcf-logo.png
  # Logo é branco com fundo transparente: fundo na cor primária do app.
  adaptive_icon_background: "#007A33"
  adaptive_icon_foreground: assets/hcf-logo.png
  # Mantém o anel de texto do logo dentro da área segura das máscaras do launcher.
  adaptive_icon_foreground_inset: 20

flutter:
  uses-material-design: true
  assets:
    - assets/
